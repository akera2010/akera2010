plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akera.controlhoras'
    compileSdk 34

    defaultConfig {
        applicationId "com.akera.controlhoras"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // sin dependencias externas — app 100% HTML
}
