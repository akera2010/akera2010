name: Build Control Horas APK

on:
  push:
    paths:
      - 'control-horas-android/**'
      - 'control-horas/index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Sync HTML asset
        run: cp control-horas/index.html control-horas-android/app/src/main/assets/index.html

      - name: Grant execute permission for gradlew
        working-directory: control-horas-android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: control-horas-android
        run: gradle assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build release APK (signed with debug key)
        working-directory: control-horas-android
        run: gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlHoras-debug
          path: control-horas-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlHoras-release
          path: control-horas-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Control Horas v1.${{ github.run_number }}"
          body: |
            ## Control Horas APK
            Compilado automáticamente desde el commit `${{ github.sha }}`.

            ### Instalación
            1. Descarga `ControlHoras-debug.apk`
            2. En Android: Ajustes → Seguridad → Instalar desde fuentes desconocidas
            3. Instala el APK

            > La versión debug ya está firmada y lista para instalar.
          files: |
            control-horas-android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
