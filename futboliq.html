<script>
'use strict';
/* ===== CONSTANTES ===== */
const PRM=Object.freeze({
  VERSION:'5.0',MEDIA_GOLES:1.35,K_MU:8,VENTAJA:0.20,
  RHO:-0.05,HL:3.0,N:100000,UMBRAL:0.80,TOP:8,
  MIN_P:5,MAX_G:6,K_SHR:4,DIAS:120,MIN_ODDS:1.45,
});
const LS='fiq4-';
const BANNED=new Set(['btts_no']);
const LEAGUE_TZ={
  'esp.1':'Europe/Madrid','esp.2':'Europe/Madrid',
  'eng.1':'Europe/London','eng.2':'Europe/London',
  'sco.1':'Europe/London',
  'ger.1':'Europe/Berlin','ger.2':'Europe/Berlin',
  'ita.1':'Europe/Rome','ita.2':'Europe/Rome',
  'fra.1':'Europe/Paris','fra.2':'Europe/Paris',
  'por.1':'Europe/Lisbon',
  'ned.1':'Europe/Amsterdam',
  'bel.1':'Europe/Brussels',
  'tur.1':'Europe/Istanbul',
  'gre.1':'Europe/Athens',
  'rou.1':'Europe/Bucharest',
  'aut.1':'Europe/Vienna',
  'sui.1':'Europe/Zurich',
  'den.1':'Europe/Copenhagen',
  'nor.1':'Europe/Oslo',
  'swe.1':'Europe/Stockholm',
  'cze.1':'Europe/Prague',
  'pol.1':'Europe/Warsaw',
};
function fmtTime(iso,lgId,venue,city){
  if(!iso)return'';
  const d=new Date(iso);
  const mad=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'});
  const car=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'America/Caracas'});
  const localTZ=LEAGUE_TZ[lgId];
  let localPart='';
  if(localTZ){
    const localT=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:localTZ});
    const tzShort=localTZ.split('/')[1].replace(/_/g,' ');
    localPart=` · ${localT}<span class="tz-name">📍${tzShort}</span>`;
  }
  const venueStr=(city||venue)?`<span class="venue-info">🏟 ${[city,venue].filter(Boolean).join(' · ')}</span>`:'';
  return`<span class="time-dual">${mad}<span class="tz-name">MAD</span> · ${car}<span class="tz-name">CCS</span>${localPart}${venueStr}</span>`;
}

/* ===== MEDIAS POR LIGA (goles/partido) ===== */
const LEAGUE_MEANS={
  'eng.1':2.90,'ger.1':3.15,'ned.1':3.25,'fra.1':2.65,'esp.1':2.80,
  'ita.1':2.75,'por.1':2.80,'tur.1':2.95,'bel.1':2.95,'gre.1':2.65,
  'sco.1':2.75,'aut.1':3.00,'sui.1':2.90,'den.1':3.00,'nor.1':3.00,
  'swe.1':2.85,'eng.2':2.70,'ger.2':3.00,'esp.2':2.50,'ita.2':2.55,
  'fra.2':2.55,'cze.1':2.80,'pol.1':2.65,'rou.1':2.65,
};
/* ===== MATH ===== */
const rng=seed=>{let s=seed>>>0;return()=>{s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296;};};
function poisPmf(k,lam){if(lam<=0)return k===0?1:0;let p=Math.exp(-lam),r=p;for(let i=1;i<=k;i++)r=r*lam/i;return r;}
function poisInv(u,lam){let k=0,cum=0;while(cum<u){cum+=poisPmf(k,lam);if(cum>=u)return k;k++;if(k>30)return k;}return k;}

function calcElo(hist){
  if(!hist||!hist.length)return 1500;
  const W=hist.map((_,i)=>Math.exp(-Math.LN2*i/PRM.HL));
  let sw=0,swr=0,sgd=0;
  hist.forEach((x,i)=>{const w=W[i],res=x.gf>x.ga?1:x.gf===x.ga?0.5:0;swr+=w*res;sgd+=w*(x.gf-x.ga);sw+=w;});
  const wr=swr/sw,agd=sgd/sw;
  return 1500+50*(wr-0.5)*100/50+8*agd;
}
function shrink(avg,n,mean){const m=mean||PRM.MEDIA_GOLES;return(n*avg+PRM.K_SHR*m)/(n+PRM.K_SHR);}
function calcLambdas(hH,hA,lgId){
  const mean=(LEAGUE_MEANS[lgId]||PRM.MEDIA_GOLES)/2;
  const avgH=hH.length?hH.reduce((a,x)=>a+x.gf,0)/hH.length:mean;
  const avgA=hA.length?hA.reduce((a,x)=>a+x.ga,0)/hA.length:mean;
  const avgHc=hH.length?hH.reduce((a,x)=>a+x.ga,0)/hH.length:mean;
  const avgAc=hA.length?hA.reduce((a,x)=>a+x.gf,0)/hA.length:mean;
  const lgMean=LEAGUE_MEANS[lgId]||PRM.MEDIA_GOLES;
  let lh=shrink(avgH,hH.length,lgMean/2)*shrink(avgAc,hA.length,lgMean/2)/(lgMean/2);
  let la=shrink(avgA,hA.length,lgMean/2)*shrink(avgHc,hH.length,lgMean/2)/(lgMean/2);
  const diff=(calcElo(hH)-calcElo(hA))/400;
  const elo=1+0.15*Math.tanh(diff);
  lh*=elo*(1+PRM.VENTAJA);la/=elo;
  return{lh:Math.max(0.3,lh),la:Math.max(0.3,la)};
}
function runMC(lh,la,seed){
  const N=PRM.N,half=N/2,r=rng(seed^0xDEAD);
  let c1=0,cX=0,c2=0,c15=0,c25=0,cBT=0,c35=0,c0=0;
  for(let i=0;i<half;i++){
    const u1=r(),u2=r();
    [[poisInv(u1,lh),poisInv(u2,la)],[poisInv(1-u1,lh),poisInv(1-u2,la)]].forEach(([gh,ga])=>{
      const t=gh+ga;
      if(gh>ga)c1++;else if(gh===ga)cX++;else c2++;
      if(t>1.5)c15++;if(t>2.5)c25++;if(t>3.5)c35++;if(t===0)c0++;
      if(gh>0&&ga>0)cBT++;
    });
  }
  return{p1:c1/N,pX:cX/N,p2:c2/N,BTTS:cBT/N,'G+1.5':c15/N,'G-1.5':1-c15/N,'G+2.5':c25/N,'G-2.5':1-c25/N,'G+3.5':c35/N,'G-3.5':1-c35/N,'G-0.5':c0/N,'G+0.5':1-c0/N};
}
function stability(hist){
  if(!hist||hist.length<3)return 0.5;
  const diffs=hist.slice(0,8).map(x=>x.gf-x.ga);
  const mu=diffs.reduce((a,v)=>a+v,0)/diffs.length;
  const v=diffs.reduce((a,v)=>a+(v-mu)**2,0)/diffs.length;
  return Math.max(0,1-Math.sqrt(v)/3);
}
function pscore(mkt,R){
  const stab=stability(R.hH||[]),rel=Math.min(1,(R.hH||[]).length/PRM.MIN_P);
  const ob=mkt.odds>=PRM.MIN_ODDS?0.02:0;
  return mkt.p+0.05*stab+0.03*rel+ob;
}
function impliedOdds(p){return p<=0||p>=1?1.01:Math.round((1/p)*0.95*100)/100;}
function allMkts(R){
  const mc=R.mc;
  return[
    {code:'1',label:'Victoria Local',p:mc.p1},
    {code:'X',label:'Empate',p:mc.pX},
    {code:'2',label:'Victoria Visitante',p:mc.p2},
    {code:'g15p',label:'Más 1.5 Goles',p:mc['G+1.5']},
    {code:'g25p',label:'Más 2.5 Goles',p:mc['G+2.5']},
    {code:'g15m',label:'Menos 1.5 Goles',p:mc['G-1.5']},
    {code:'g25m',label:'Menos 2.5 Goles',p:mc['G-2.5']},
    {code:'btts',label:'BTTS Sí',p:mc.BTTS},
    {code:'g35p',label:'Más 3.5 Goles',p:mc['G+3.5']},
    {code:'g35m',label:'Menos 3.5 Goles',p:mc['G-3.5']},
    {code:'g05m',label:'Sin Goles',p:mc['G-0.5']},
  ].map(m=>({...m,odds:impliedOdds(m.p)})).filter(m=>m.p>0.01&&m.p<0.99&&m.odds>=PRM.MIN_ODDS);
}

const BASE='https://site.api.espn.com/apis/site/v2/sports/soccer';
const LEAGUES=[

async function fetchT(url,ms=8000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});clearTimeout(t);return r;}catch(e){clearTimeout(t);throw e;}
}
async function fetchGames(){
  const ds=new Date().toISOString().slice(0,10).replace(/-/g,'');
  const fetches=LEAGUES.map(lg=>
    fetchT(`${BASE}/${lg.id}/scoreboard?dates=${ds}&limit=50`)
      .then(r=>r.ok?r.json():{events:[]})
      .then(d=>(d.events||[]).filter(e=>e.status?.type?.state==='pre').map(e=>{
        const comp=e.competitions?.[0];
        const hm=comp?.competitors?.find(c=>c.homeAway==='home');
        const aw=comp?.competitors?.find(c=>c.homeAway==='away');
        if(!hm||!aw)return null;
        return{id:e.id,league:lg.name,flag:lg.flag,leagueId:lg.id,
          home:hm.team.displayName,homeId:hm.team.id,
          away:aw.team.displayName,awayId:aw.team.id,time:e.date,
          venue:comp?.venue?.fullName,city:comp?.venue?.address?.city};
      }).filter(Boolean))
      .catch(()=>[])
  );
  const settled=await Promise.allSettled(fetches);
  const all=settled.flatMap(r=>r.status==='fulfilled'?r.value:[]);
  const today=new Date().toISOString().slice(0,10);
  const espnKeys=new Set(all.map(g=>statzKey(g.home,g.away)));
  STATZ_FIXTURES.forEach(sf=>{
    if(!sf.time||sf.time.slice(0,10)!==today)return;
    if(!espnKeys.has(statzKey(sf.home,sf.away)))all.push(sf);
  });
  return all;
}
async function fetchHist(lgId,teamId){
  const hist=[];
  try{
    const r=await fetchT(`${BASE}/${lgId}/teams/${teamId}/schedule?limit=20`,6000);
    if(!r.ok)return hist;
    const d=await r.json();
    (d.events||[]).filter(e=>e.status?.type?.completed).slice(0,15).forEach(e=>{
      const comp=e.competitions?.[0];
      const my=comp?.competitors?.find(c=>c.team?.id===String(teamId));
      const op=comp?.competitors?.find(c=>c.team?.id!==String(teamId));
      if(!my||!op)return;
      hist.push({gf:+my.score||0,ga:+op.score||0});
    });
  }catch(e){}
  return hist;
}

/* ===== MOTOR ===== */
async function computeGame(g,idx){
  const[hH,hA]=await Promise.all([fetchHist(g.leagueId,g.homeId),fetchHist(g.leagueId,g.awayId)]);
  const{lh,la}=calcLambdas(hH,hA,g.leagueId);
  const seed=(+g.homeId||idx+1)*31+(+g.awayId||idx+1);
  const mc=runMC(lh,la,seed);
  // Integrar probabilidades Statz AI
  const sk=statzKey(g.home,g.away),sk2=statzKey(g.away,g.home);
  const sd=STATZ_CACHE[sk]||STATZ_CACHE[sk2];
  const swapped=!STATZ_CACHE[sk]&&!!sd;
  const isStatzOnly=String(g.homeId||'').startsWith('sz');
  if(sd){
    if(isStatzOnly){
      if(sd.winH!==undefined){mc.p1=sd.winH;mc.pX=0.22;mc.p2=Math.max(0.01,1-sd.winH-0.22);}
      if(sd.winA!==undefined){mc.p2=sd.winA;mc.pX=0.22;mc.p1=Math.max(0.01,1-sd.winA-0.22);}
      if(sd.goals2p!==undefined){mc['G+2.5']=sd.goals2p;mc['G+1.5']=Math.min(.97,sd.goals2p+.1);}
      if(sd.goals3p!==undefined)mc['G+1.5']=Math.min(.97,sd.goals3p+.12);
      if(sd.btts!==undefined)mc.BTTS=sd.btts;
      mc['G-1.5']=1-mc['G+1.5'];mc['G-2.5']=1-mc['G+2.5'];
      const t=mc.p1+mc.pX+mc.p2;mc.p1/=t;mc.pX/=t;mc.p2/=t;
    }else{
      const W=.30,wH=swapped&&sd.winA!==undefined?sd.winA:sd.winH,wA=swapped&&sd.winH!==undefined?sd.winH:sd.winA;
      if(wH!==undefined)mc.p1=mc.p1*(1-W)+wH*W;
      if(wA!==undefined)mc.p2=mc.p2*(1-W)+wA*W;
      if(sd.goals2p!==undefined)mc['G+2.5']=mc['G+2.5']*(1-W)+sd.goals2p*W;
      if(sd.goals3p!==undefined)mc['G+1.5']=mc['G+1.5']*(1-W)+Math.min(sd.goals3p+.12,.99)*W;
      if(sd.btts!==undefined)mc.BTTS=mc.BTTS*(1-W)+sd.btts*W;
      mc['G-1.5']=1-mc['G+1.5'];mc['G-2.5']=1-mc['G+2.5'];
      const t=mc.p1+mc.pX+mc.p2;if(t>0){mc.p1/=t;mc.pX/=t;mc.p2/=t;}
    }
  }
  const ppgH=hH.length?hH.reduce((a,x)=>a+(x.gf>x.ga?3:x.gf===x.ga?1:0),0)/hH.length:1;
  const ppgA=hA.length?hA.reduce((a,x)=>a+(x.gf>x.ga?3:x.gf===x.ga?1:0),0)/hA.length:1;
  const R={mc,lh,la,hH,hA,ppgH,ppgA};
  const mkts=allMkts(R);if(!mkts.length)return null;
  mkts.sort((a,b)=>pscore(b,R)-pscore(a,R));
  const best=mkts[0],sc=pscore(best,R);
  if(sc<PRM.UMBRAL)return null;
  return{...g,R,markets:mkts,bestMkt:best,score:sc,dataQ:hH.length+hA.length,statz:!!sd};
}

/* ===== COMBINADOS ===== */
function buildCombos(picks){
  if(picks.length<3)return[];
  const makeAlt=(item,excludeCode)=>{
    const avail=item.markets.filter(m=>!BANNED.has(m.code)&&m.p<0.714&&m.code!==excludeCode);
    avail.sort((a,b)=>pscore(b,item.R)-pscore(a,item.R));
    return avail[0]||null;
  };
  const combos=[];
  // Combo A
  const a0=makeAlt(picks[0],picks[0].bestMkt.code);
  const a1=makeAlt(picks[1],picks[1].bestMkt.code);
  if(a0&&a1){
    const p2=picks[2].bestMkt;
    const c={name:'Combinado A',picks:[
      {...a0,match:`${picks[0].home} vs ${picks[0].away}`},
      {...a1,match:`${picks[1].home} vs ${picks[1].away}`},
      {...p2,match:`${picks[2].home} vs ${picks[2].away}`},
    ]};
    c.pComb=c.picks.reduce((a,p)=>a*p.p,1);
    c.oddsComb=Math.round(c.picks.reduce((a,p)=>a*p.odds,1)*100)/100;
    combos.push(c);
  }
  // Combo B
  if(picks.length>=4){
    const b0=makeAlt(picks[0],picks[0].bestMkt.code);
    const b2=makeAlt(picks[2],picks[2].bestMkt.code);
    const b3=picks[3].bestMkt;
    if(b0&&b2){
      const c={name:'Combinado B',picks:[
        {...b0,match:`${picks[0].home} vs ${picks[0].away}`},
        {...b2,match:`${picks[2].home} vs ${picks[2].away}`},
        {...b3,match:`${picks[3].home} vs ${picks[3].away}`},
      ]};
      c.pComb=c.picks.reduce((a,p)=>a*p.p,1);
      c.oddsComb=Math.round(c.picks.reduce((a,p)=>a*p.odds,1)*100)/100;
      combos.push(c);
    }
  }
  return combos;
}

function mktFamily(code){if(code==='1'||code==='X'||code==='2')return'1x2';if(code==='btts')return'btts';return'goles';}

let STATE={picks:[],combos:[],date:'',loading:false};

async function boot(){
  if(STATE.loading)return;
  STATE.loading=true;
  const ov=document.getElementById('loadingOverlay');
  const lm=document.getElementById('loadingMsg');
  ov.classList.remove('hidden');
  lm.textContent='Descargando partidos…';
  document.getElementById('statusBar').textContent='Cargando…';
  try{
    STATE.date=new Date().toISOString().slice(0,10);
    document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    let games=await fetchGames();
    lm.textContent=`${games.length} partidos encontrados. Calculando…`;
    if(!games.length){games=demoGames();lm.textContent='Sin partidos en vivo — usando datos demo';}
    const results=[];
    for(let i=0;i<games.length&&results.length<PRM.TOP*2;i++){
      const g=games[i];
      lm.textContent=`Analizando ${g.home} vs ${g.away}…`;
      const r=await computeGame(g,i);
      if(r)results.push(r);
    }
    results.sort((a,b)=>b.score-a.score);
    const famC={};const divP=[];
    for(const r of results){const f=mktFamily(r.bestMkt.code);if((famC[f]||0)<2){famC[f]=(famC[f]||0)+1;divP.push(r);}if(divP.length>=PRM.TOP)break;}
    STATE.picks=divP.length>=PRM.TOP?divP:results.slice(0,PRM.TOP);
    if(!STATE.picks.length){STATE.picks=fallbackPicks();}
  }catch(err){
    console.error(err);
    STATE.picks=fallbackPicks();
  }
  STATE.combos=buildCombos(STATE.picks);
  saveRecord();
  document.getElementById('statusBar').textContent=`${STATE.picks.length} picks · Actualizado ${new Date().toLocaleTimeString('es-ES')} · v${PRM.VERSION}`;
  STATE.loading=false;
  ov.classList.add('hidden');
  renderAll();
  scheduleRefresh();
}

function saveRecord(){
  try{
    const h=getHist();
    const idx=h.findIndex(r=>r.date===STATE.date);
    const entry={date:STATE.date,picks:STATE.picks.map(p=>({match:`${p.home} vs ${p.away}`,pick:p.bestMkt.label,p:p.bestMkt.p,odds:p.bestMkt.odds})),result:'pending'};
    if(idx>=0)h[idx]=entry;else h.unshift(entry);
    localStorage.setItem(LS+'history',JSON.stringify(h.slice(0,60)));
  }catch(e){}
}

          <td>${(p.p*100).toFixed(1)}%</td><td>${p.odds}</td>
          <td>${r.result==='pending'?'<span style="color:var(--yellow)">Pendiente</span>':r.result==='hit'?'<span class="badge-hit">✓</span>':'<span class="badge-miss">✗</span>'}</td>
          <td>${ri===0&&pi===0&&r.result==='pending'?`<button onclick="markR('${r.date}','hit')" style="background:var(--green);color:#fff;border:none;padding:3px 7px;border-radius:4px;cursor:pointer;font-size:.7rem;margin-right:3px">✓</button><button onclick="markR('${r.date}','miss')" style="background:var(--red);color:#fff;border:none;padding:3px 7px;border-radius:4px;cursor:pointer;font-size:.7rem">✗</button>`:''}
          </td>
        </tr>`)).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px">Sin historial</td></tr>'}
      </tbody>
    </table>`;
}

function brierScore(h){
  const r=h.filter(x=>x.result!=='pending'&&x.picks);
  if(!r.length)return null;
  let s=0,n=0;
  r.forEach(x=>x.picks.forEach(p=>{const o=x.result==='hit'?1:0;s+=(p.p-o)**2;n++;}));
  return n?s/n:null;
}

function calChart(h){
  const r=h.filter(x=>x.result!=='pending'&&x.picks);
  if(!r.length)return'<div class="cal-chart-wrap"><p style="color:var(--muted);text-align:center;padding:20px">Sin datos de calibración aún</p></div>';
  const bins=Array.from({length:5},(_,i)=>({min:i*.2,max:(i+1)*.2,tot:0,hit:0}));
  r.forEach(x=>x.picks.forEach(p=>{
    const o=x.result==='hit'?1:0;
    const b=bins.find(b=>p.p>=b.min&&p.p<b.max)||bins[4];
    b.tot++;b.hit+=o;
  }));
  return`<div class="cal-chart-wrap">
    <div style="font-weight:700;margin-bottom:12px;color:var(--acc)">Curva de Calibración</div>
    ${bins.map(b=>{const a=b.tot?b.hit/b.tot:0,exp=(b.min+b.max)/2;return`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.8rem">
      <span style="width:70px;color:var(--muted)">${Math.round(b.min*100)}–${Math.round(b.max*100)}%</span>
      <div style="flex:1;height:16px;background:var(--s3);border-radius:4px;overflow:hidden;position:relative">
        <div style="width:${a*100}%;height:100%;background:${ringColor(a)}"></div>
        <div style="position:absolute;top:0;bottom:0;left:${exp*100}%;width:2px;background:rgba(255,255,255,.35)"></div>
      </div>
      <span style="width:55px;text-align:right">${b.tot?`${(a*100).toFixed(0)}% (${b.tot})`:'—'}</span>
    </div>`;}).join('')}
    <div style="font-size:.7rem;color:var(--muted);margin-top:8px">Línea blanca = probabilidad esperada · Izquierda = real</div>
  </div>`;
}

window.markR=function(date,res){
  const h=getHist();const r=h.find(x=>x.date===date);
  if(r){r.result=res;try{localStorage.setItem(LS+'history',JSON.stringify(h));}catch(e){}renderRecord();}
};
window.exportHist=function(){
  const blob=new Blob([JSON.stringify(getHist(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`futboliq-historial-${new Date().toISOString().slice(0,10)}.json`;a.click();
};
window.importHist=function(e){
  const file=e.target.files[0];if(!file)return;
  const rdr=new FileReader();
  rdr.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data))throw new Error('formato inválido');
      const existing=getHist();
      const merged=[...data];
      existing.forEach(r=>{if(!merged.find(m=>m.date===r.date))merged.push(r);});
      merged.sort((a,b)=>b.date.localeCompare(a.date));
      localStorage.setItem(LS+'history',JSON.stringify(merged.slice(0,60)));
      renderRecord();alert(`Historial importado: ${merged.length} entradas`);
    }catch(err){alert('Error al importar: '+err.message);}
  };
  rdr.readAsText(file);
};

/* ===== TABS ===== */
function switchTab(t){
  ['picks','combos','record'].forEach(id=>{
    const el=document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1));
    el.classList.toggle('hidden',id!==t);
  });
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.tab===t));
}

/* ===== PDF ===== */
function exportPDF(){
  const{jsPDF}=window.jspdf;
  if(!jsPDF){alert('jsPDF no cargado. Verifica la conexión.');return;}
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  // Fondo blanco profesional
  doc.setFillColor(255,255,255);doc.rect(0,0,297,210,'F');
  // Banda superior verde
  doc.setFillColor(21,128,61);doc.rect(0,0,297,28,'F');
  doc.setTextColor(255,255,255);doc.setFontSize(18);doc.setFont('helvetica','bold');
  doc.text('FútbolIQ · Sandra Blanco',14,13);
  doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(220,255,220);
  const fechaStr=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  doc.text(`${fechaStr} · ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})} · Dixon-Coles + ELO + Monte Carlo ${PRM.N.toLocaleString()} sim`,14,21);
  const pdfT=(iso,tz)=>iso?new Date(iso).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:tz}):'—';
  const rows=STATE.picks.map((p,i)=>[`#${i+1}`,`${p.home} vs ${p.away}`,p.league,pdfT(p.time,'Europe/Madrid'),pdfT(p.time,'America/Caracas'),p.bestMkt.label,`${(p.bestMkt.p*100).toFixed(1)}%`,`${p.bestMkt.odds}`,`${(p.score*100).toFixed(0)}%`]);
  doc.autoTable({startY:32,head:[['#','Partido','Liga','Hora MAD','Hora CCS','Pick','Prob.','Cuota','Score']],body:rows,
    styles:{fillColor:[255,255,255],textColor:[20,30,20],fontSize:9,lineColor:[200,220,200],lineWidth:.3},
    headStyles:{fillColor:[21,128,61],textColor:[255,255,255],fontStyle:'bold'},
    alternateRowStyles:{fillColor:[240,250,240]},theme:'grid'});
  if(STATE.combos.length){
    let y=doc.lastAutoTable.finalY+10;
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(21,128,61);
    doc.text('Combinados Sugeridos',14,y);y+=6;
    STATE.combos.forEach(cb=>{
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(20,30,20);
      doc.text(`${cb.name} · @${cb.oddsComb} · P.combo ${(cb.pComb*100).toFixed(1)}%`,14,y);y+=5;
      cb.picks.forEach(pk=>{doc.setFont('helvetica','normal');doc.setTextColor(60,80,60);doc.text(`  • ${pk.match}: ${pk.label} @${pk.odds} (${(pk.p*100).toFixed(1)}%)`,18,y);y+=4;});
      y+=3;
    });
  }
  // Pie de página
  doc.setFontSize(7);doc.setTextColor(100,120,100);
  doc.text('Por Data Science Sandra Blanco | akera2011@protonmail.com',14,205);
  doc.save(`futboliq-${STATE.date||'hoy'}.pdf`);
}

/* ===== AUTO-REFRESH ===== */
function scheduleRefresh(){
  const now=new Date();
  const mad=new Date(now.toLocaleString('en-US',{timeZone:'Europe/Madrid'}));
  const next=new Date(mad);next.setDate(next.getDate()+1);next.setHours(5,0,0,0);
  setTimeout(boot,next-mad);
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded',()=>{boot();});
</script>
