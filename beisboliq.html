<script>
'use strict';
/* ===== CONSTANTES ===== */
const PRM=Object.freeze({
  VERSION:'1.0',N:50000,UMBRAL:0.63,TOP:8,
  MIN_P:5,MIN_ODDS:1.10,
});
const LS='biq1-';
const BANNED=new Set([]);

/* ===== UTILIDADES ===== */
function fmtTime(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const mad=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'});
  const car=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'America/Caracas'});
  return`<span class="time-dual">${mad}<span class="tz-name">MAD</span> · ${car}<span class="tz-name">CCS</span></span>`;
}
function todayMadrid(){
  return new Date().toLocaleString('en-CA',{timeZone:'Europe/Madrid'}).slice(0,10);
}

/* ===== MATH ===== */
const rng=seed=>{let s=seed>>>0;return()=>{s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296;};};
function poisPmf(k,lam){if(lam<=0)return k===0?1:0;let r=Math.exp(-lam);for(let i=1;i<=k;i++)r=r*lam/i;return r;}
function poisInv(u,lam){let k=0,cum=0;while(cum<u){cum+=poisPmf(k,lam);if(cum>=u)return k;k++;if(k>30)return k;}return k;}

function runMC(lh,la,seed){
  const N=PRM.N,half=N/2,r=rng(seed^0xBEEF);
  let c1=0,c2=0,cAlta=0,cBaja=0,cRL1=0,cRL2=0;
  for(let i=0;i<half;i++){
    const u1=r(),u2=r();
    [[poisInv(u1,lh),poisInv(u2,la)],[poisInv(1-u1,lh),poisInv(1-u2,la)]].forEach(([rh,ra])=>{
      if(rh>ra){c1++;if(rh-ra>=2)cRL1++;}else c2++;
      if(ra>=rh||rh-ra<=1)cRL2++;
      if(rh+ra>6.5)cAlta++;else cBaja++;
    });
  }
  return{p1:c1/N,p2:c2/N,alta:cAlta/N,baja:cBaja/N,rl1:cRL1/N,rl2:cRL2/N};
}

function impliedOdds(p){return p<=0||p>=1?1.01:Math.round((1/p)*0.95*100)/100;}

function allMkts(R){
  const mc=R.mc;
  return[
    {code:'1',label:'Victoria Local',p:mc.p1},
    {code:'2',label:'Victoria Visitante',p:mc.p2},
    {code:'alta',label:'Alta +6.5 Carreras',p:mc.alta},
    {code:'baja',label:'Baja -6.5 Carreras',p:mc.baja},
    {code:'rl1',label:'Run Line Local (-1.5)',p:mc.rl1},
    {code:'rl2',label:'Run Line Visit. (+1.5)',p:mc.rl2},
  ].map(m=>({...m,odds:impliedOdds(m.p)}))
   .filter(m=>m.p>0.01&&m.p<0.99&&m.odds>=PRM.MIN_ODDS&&!BANNED.has(m.code));
}

function mktFamily(code){
  if(code==='1'||code==='2')return'ml';
  if(code==='rl1'||code==='rl2')return'rl';
  return'ou';
}

function stability(hist){
  if(!hist||hist.length<3)return 0.5;
  const diffs=hist.slice(0,8).map(x=>x.gf-x.ga);
  const mu=diffs.reduce((a,v)=>a+v,0)/diffs.length;
  const v=diffs.reduce((a,v)=>a+(v-mu)**2,0)/diffs.length;
  return Math.max(0,1-Math.sqrt(v)/3);
}
function pscore(mkt,R){
  const stab=stability(R.hH||[]),rel=Math.min(1,(R.hH||[]).length/PRM.MIN_P);
  const ob=mkt.odds>=PRM.MIN_ODDS?0.02:0;
  return mkt.p+0.05*stab+0.03*rel+ob;
}
function normTeam(n){
  return(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\b(fc|cf|sc|afc|bfc|ac|ss|as|ud|rc|sd|cd|rb|vfb|vfl|bvb)\b/g,'')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function statzKey(h,a){return normTeam(h)+'|'+normTeam(a);}

/* ===== COMBINADOS ===== */
function buildCombos(picks){
  if(picks.length<3)return[];
  const combos=[];
  for(let i=0;i<Math.min(picks.length,6);i++){
    for(let j=i+1;j<Math.min(picks.length,6);j++){
      for(let k=j+1;k<Math.min(picks.length,6);k++){
        const pa=picks[i],pb=picks[j],pc=picks[k];
        const getAlt=p=>p.markets.filter(m=>m.code!==p.bestMkt.code&&m.p>=0.55&&!BANNED.has(m.code))[0]||(p.bestMkt.p>=0.60?p.bestMkt:null);
        const ma=getAlt(pa),mb=getAlt(pb),mc2=getAlt(pc);
        if(!ma||!mb||!mc2)continue;
        const pComb=ma.p*mb.p*mc2.p;
        if(pComb<0.25)continue;
        combos.push({
          name:`Combinado ${combos.length+1}`,
          pComb,oddsComb:parseFloat((ma.odds*mb.odds*mc2.odds).toFixed(2)),
          picks:[
            {match:`${pa.home} vs ${pa.away}`,label:ma.label,p:ma.p,odds:ma.odds},
            {match:`${pb.home} vs ${pb.away}`,label:mb.label,p:mb.p,odds:mb.odds},
            {match:`${pc.home} vs ${pc.away}`,label:mc2.label,p:mc2.p,odds:mc2.odds},
          ]
        });
        if(combos.length>=10)break;
      }
      if(combos.length>=10)break;
    }
    if(combos.length>=10)break;
  }
  combos.sort((a,b)=>b.pComb-a.pComb);
  return combos.slice(0,2);
}

async function fetchStatzData(){
  try{
    const r=await fetch(STATZ_REMOTE_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok){console.warn('[BeisbolIQ] baseball_data.json HTTP',r.status);return;}
    const d=await r.json();
    if(d.cache&&typeof d.cache==='object'){
      Object.keys(STATZ_CACHE_B).forEach(k=>delete STATZ_CACHE_B[k]);
      Object.assign(STATZ_CACHE_B,d.cache);
    }
    if(Array.isArray(d.fixtures)&&d.fixtures.length){
      STATZ_FIXTURES_B.length=0;
      STATZ_FIXTURES_B.push(...d.fixtures);
    }
    if(Array.isArray(d.picks)&&d.picks.length&&d.updated===todayMadrid()){
      STATE.bakedPicks=d.picks;
      STATE.bakedCombos=Array.isArray(d.combos)?d.combos:[];
    }
    console.info('[BeisbolIQ] Datos del día cargados:',d.updated||'?');
  }catch(e){
    console.warn('[BeisbolIQ] fetch remoto fallido — usando caché local:',e.message);
  }
}

function computePicksFromStatz(){
  const W=0.65,today=todayMadrid();
  const LG_AVG={mlb:4.5,'ven.1':4.2,'mex.1':4.3,'dom.1':4.4};
  const games=STATZ_FIXTURES_B.filter(sf=>{
    if(!sf.time)return false;
    const d=new Date(sf.time).toLocaleString('en-CA',{timeZone:'Europe/Madrid'}).slice(0,10);
    return d===today;
  });
  if(!games.length)return[];
  const results=[];
  for(const g of games){
    const k=statzKey(g.home,g.away);
    const sd=STATZ_CACHE_B[k]||{};
    const lgAvg=LG_AVG[g.leagueId]||4.3;
    let lh=sd.xRH||(sd.winH?(sd.winH>0.5?lgAvg*1.1:lgAvg*0.9):lgAvg);
    let la=sd.xRA||(sd.winA?(sd.winA>0.5?lgAvg*1.1:lgAvg*0.9):lgAvg);

    let hs=0xDEADBEEF;
    const ss=(g.home+g.away).toLowerCase();
    for(let i=0;i<ss.length;i++){hs=Math.imul(hs^ss.charCodeAt(i),0x9e3779b9);hs^=hs>>>16;}
    const mc=runMC(lh,la,hs>>>0);

    if(sd.winH!==undefined){mc.p1=mc.p1*(1-W)+sd.winH*W;}
    if(sd.winA!==undefined){mc.p2=mc.p2*(1-W)+sd.winA*W;}
    if(sd.total!==undefined){
      mc.alta=mc.alta*(1-W)+(sd.total>8.5?0.68:sd.total<7.5?0.35:0.52)*W;
      mc.baja=1-mc.alta;
    }
    const totML=mc.p1+mc.p2;if(totML>0){mc.p1/=totML;mc.p2/=totML;}

    const R={mc,lh,la,hH:[],hA:[],pitcherH:sd.pitcherH||null,pitcherA:sd.pitcherA||null};
    const mkts=allMkts(R);mkts.sort((a,b)=>pscore(b,R)-pscore(a,R));
    if(!mkts.length)continue;
    const best=mkts[0];const sc=pscore(best,R);
    if(sc<PRM.UMBRAL)continue;
    results.push({...g,R,markets:mkts,bestMkt:best,score:sc,pitcherH:sd.pitcherH||null,pitcherA:sd.pitcherA||null,dataQ:0,statz:true});
  }
  results.sort((a,b)=>b.score-a.score);
  const mlbP=results.filter(r=>r.leagueId==='mlb');
  const carP=results.filter(r=>r.leagueId!=='mlb');
  if(mlbP.length>=5)return[...mlbP.slice(0,5),...carP.slice(0,3)];
  const famC={},divP=[];
  for(const r of results){
    const f=mktFamily(r.bestMkt.code);
    if((famC[f]||0)<2){famC[f]=(famC[f]||0)+1;divP.push(r);}
    if(divP.length>=PRM.TOP)break;
  }
  return divP.length>=PRM.TOP?divP:results.slice(0,PRM.TOP);
}

let STATE={picks:[],combos:[],date:'',loading:false,lastFetch:0,bakedPicks:null,bakedCombos:null};

async function boot(){
  if(STATE.loading)return;
  STATE.loading=true;
  const ov=document.getElementById('loadingOverlay');
  const lm=document.getElementById('loadingMsg');
  ov.classList.remove('hidden');
  lm.textContent='Cargando partidos de hoy…';
  document.getElementById('statusBar').textContent='Actualizando…';
  STATE.date=todayMadrid();
  document.getElementById('dateLabel').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Madrid'});
  // Mostrar picks inline INMEDIATAMENTE (sin red) si son de hoy
  if(BAKED_DATE_B===STATE.date&&BAKED_PICKS_B.length){
    STATE.picks=BAKED_PICKS_B;
    STATE.combos=BAKED_COMBOS_B.length?BAKED_COMBOS_B:buildCombos(STATE.picks);
    ov.classList.add('hidden');
    STATE.loading=false;
    renderAll();
    document.getElementById('statusBar').textContent=`${STATE.picks.length} picks · ${STATE.date} · v${PRM.VERSION} · MLB+Caribe`;
    saveRecord();
    STATE.loading=true;
  }
  // Fetch en segundo plano para actualizar con datos frescos
  try{
    lm.textContent='Verificando datos frescos…';
    STATE.bakedPicks=null;STATE.bakedCombos=null;
    await fetchStatzData();
    if(STATE.bakedPicks&&STATE.bakedPicks.length){
      STATE.picks=STATE.bakedPicks;
      STATE.combos=STATE.bakedCombos&&STATE.bakedCombos.length?STATE.bakedCombos:buildCombos(STATE.picks);
    }else if(!STATE.picks.length){
      lm.textContent='Calculando picks del día…';
      STATE.picks=computePicksFromStatz();
      STATE.combos=buildCombos(STATE.picks);
    }
  }catch(err){
    console.error('[BeisbolIQ] boot error:',err);
    if(!STATE.picks.length){STATE.picks=computePicksFromStatz();STATE.combos=buildCombos(STATE.picks);}
  }
  STATE.lastFetch=Date.now();
  if(!STATE.combos.length&&STATE.picks.length)STATE.combos=buildCombos(STATE.picks);
  saveRecord();
  document.getElementById('statusBar').textContent=`${STATE.picks.length} picks · ${STATE.date} · v${PRM.VERSION} · MLB+Caribe`;
  STATE.loading=false;
  ov.classList.add('hidden');
  renderAll();
  scheduleRefresh();
}

function saveRecord(){
  try{
    const h=getHist();
    const idx=h.findIndex(r=>r.date===STATE.date);

}

function brierScore(h){
  const r=h.filter(x=>x.result!=='pending'&&x.picks);
  if(!r.length)return null;
  let s=0,n=0;
  r.forEach(x=>x.picks.forEach(p=>{const o=x.result==='hit'?1:0;s+=(p.p-o)**2;n++;}));
  return n?s/n:null;
}
function calChart(h){
  const r=h.filter(x=>x.result!=='pending'&&x.picks);
  if(!r.length)return'<div class="cal-chart-wrap"><p style="color:var(--muted);text-align:center;padding:20px">Sin datos de calibración aún</p></div>';
  const bins=Array.from({length:5},(_,i)=>({min:i*.2,max:(i+1)*.2,tot:0,hit:0}));
  r.forEach(x=>x.picks.forEach(p=>{
    const o=x.result==='hit'?1:0;
    const b=bins.find(b=>p.p>=b.min&&p.p<b.max)||bins[4];
    b.tot++;b.hit+=o;
  }));
  return`<div class="cal-chart-wrap">
    <div style="font-weight:700;margin-bottom:12px;color:var(--acc)">Curva de Calibración</div>
    ${bins.map(b=>{const a=b.tot?b.hit/b.tot:0,exp=(b.min+b.max)/2;return`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.8rem">
      <span style="width:70px;color:var(--muted)">${Math.round(b.min*100)}–${Math.round(b.max*100)}%</span>
      <div style="flex:1;height:16px;background:var(--s3);border-radius:4px;overflow:hidden;position:relative">
        <div style="width:${a*100}%;height:100%;background:${ringColor(a)}"></div>
        <div style="position:absolute;top:0;bottom:0;left:${exp*100}%;width:2px;background:rgba(255,255,255,.35)"></div>
      </div>
      <span style="width:55px;text-align:right">${b.tot?`${(a*100).toFixed(0)}% (${b.tot})`:'—'}</span>
    </div>`;}).join('')}
    <div style="font-size:.7rem;color:var(--muted);margin-top:8px">Línea blanca = probabilidad esperada · Izquierda = real</div>
  </div>`;
}

    styles:{fillColor:[255,255,255],textColor:[15,23,42],fontSize:8.5,lineColor:[148,163,184],lineWidth:.25,cellPadding:2.8},
    headStyles:{fillColor:[29,78,216],textColor:[255,255,255],fontStyle:'bold',fontSize:8,halign:'center'},
    alternateRowStyles:{fillColor:[237,242,248]},
    columnStyles:{
      0:{cellWidth:8,halign:'center'},1:{cellWidth:7,halign:'center'},
      2:{cellWidth:65},3:{cellWidth:28},
      4:{cellWidth:16,halign:'center'},5:{cellWidth:16,halign:'center'},
      6:{cellWidth:38},7:{cellWidth:14,halign:'center'},
      8:{cellWidth:14,halign:'center'},9:{cellWidth:14,halign:'center'},
    },
    theme:'grid',margin:{left:ML,right:MR},
    didDrawCell:function(data){
      if(data.column.index===0&&data.section==='body'){
        const cx=data.cell.x+(data.cell.width-4)/2;
        const cy=data.cell.y+(data.cell.height-4)/2;
        data.doc.setDrawColor(100,100,120);data.doc.setLineWidth(.4);data.doc.rect(cx,cy,4,4);
      }
    },
  });
  if(STATE.combos.length){
    let y=doc.lastAutoTable.finalY+9;
    if(y>H-25){doc.addPage();doc.setFillColor(255,255,255);doc.rect(0,0,W,H,'F');y=14;}
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(29,78,216);
    doc.text('Combinados Sugeridos',ML,y);y+=7;
    STATE.combos.forEach(cb=>{
      if(y>H-22){doc.addPage();doc.setFillColor(255,255,255);doc.rect(0,0,W,H,'F');y=14;}
      doc.setDrawColor(100,100,120);doc.setLineWidth(.4);doc.rect(ML,y-3.2,3.8,3.8);
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(15,23,42);
      doc.text(`  ${cb.name}   Cuota @${cb.oddsComb}   P.combinado ${(cb.pComb*100).toFixed(1)}%`,ML+5,y);y+=5;
      cb.picks.forEach(pk=>{
        doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(71,85,105);
        doc.text(`      •  ${pk.match||'—'}:  ${pk.label}  @${pk.odds}  (${(pk.p*100).toFixed(1)}%)`,ML+5,y);y+=4;
      });
      y+=3;
    });
  }
  doc.setDrawColor(148,163,184);doc.setLineWidth(.4);doc.line(ML,H-10,W-MR,H-10);
  doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(15,23,42);
  doc.text('Por Data Science Sandra Blanco',ML,H-5);
  const wBrand=doc.getTextWidth('Por Data Science Sandra Blanco');
  doc.setFont('helvetica','normal');doc.setTextColor(71,85,105);
  doc.text('  |  akera2011@protonmail.com',ML+wBrand,H-5);
  doc.setFontSize(7);
  doc.text('Analisis Bayesiano · Poisson · Monte Carlo 50.000 sim · MLB + Caribe',W-MR,H-5,{align:'right'});
  doc.save(`beisboliq-${STATE.date||new Date().toISOString().slice(0,10)}.pdf`);
}

/* ===== AUTO-REFRESH ===== */
function scheduleRefresh(){
  const now=new Date();
  const mad=new Date(now.toLocaleString('en-US',{timeZone:'Europe/Madrid'}));
  const next=new Date(mad);next.setDate(next.getDate()+1);next.setHours(9,0,0,0);
  setTimeout(()=>{boot();scheduleRefresh();},next-mad);
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded',()=>{boot();});
window.addEventListener('pageshow',(e)=>{if(e.persisted&&!STATE.loading)boot();});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&!STATE.loading){
    const age=Date.now()-(STATE.lastFetch||0);
    if(age>10*60*1000)boot();
  }
});
setInterval(()=>{if(STATE.picks.length&&!STATE.loading)renderAll();},60000);
</script>
</body>
</html>
