}
*{box-sizing:border-box;margin:0;padding:0}
@keyframes metalShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
body{background:#f4f7fb;color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
#app{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:32px}
.logo-text h1{font-size:1.4rem;font-weight:700;color:var(--text);line-height:1.2}
.logo-text .sub-brand{display:block;font-size:.8rem;font-weight:600;color:var(--text);margin-top:2px}
.logo-text .sub-algo{display:block;font-size:.72rem;color:var(--muted);margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#dateLabel{font-size:.85rem;color:#fff;font-weight:700;background:var(--acc);padding:6px 12px;border-radius:8px;border:1px solid var(--acc)}
#pdfBtn{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:600;transition:opacity .2s}
#pdfBtn:hover{opacity:.85}
#statusBar{font-size:.8rem;color:var(--muted);padding:4px 10px;background:var(--s2);border-radius:6px;border:1px solid var(--border)}
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--s1);padding:4px;border-radius:10px;border:1px solid var(--border)}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;border-radius:8px;font-size:.85rem;font-weight:600;color:var(--muted);transition:all .2s}
.tab.active{background:var(--acc);color:#fff}
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-val{font-size:1.6rem;font-weight:700;color:var(--acc)}
.stat-lbl{font-size:.75rem;color:var(--muted);margin-top:2px}
.picks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.pick-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pick-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pick-card[data-league="nba"]::before{background:linear-gradient(90deg,#c8102e,#17408b)}
.pick-card[data-league="euroliga"]::before{background:linear-gradient(90deg,#0a1540,#1a3a7c)}
.pick-card[data-league="eurocup"]::before{background:linear-gradient(90deg,#6d1f7e,#4a148c)}
.pick-card[data-league="acb"]::before{background:linear-gradient(90deg,#c00000,#8b0000)}
.pick-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pick-match{font-weight:700;font-size:.95rem}
.pick-league{font-size:.75rem;color:var(--muted);margin-top:2px}
.pick-badge{background:#dbeafe;color:#c00000;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid #93c5fd}
.pick-badge.alto{background:#dcfce7;color:#c00000;border-color:#86efac}
.pick-badge.medio{background:#fef9c3;color:#c00000;border-color:#fde047}
.ratings-row{margin:8px 0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rat-team{padding:5px 10px;font-size:.71rem;color:var(--muted)}
.rat-team:first-child{border-bottom:1px solid var(--border)}
.rat-team b{color:var(--text)}
.rat-name{font-weight:700;color:var(--text);display:inline-block;min-width:72px;margin-right:4px;font-size:.72rem}
.rec-row{display:flex;flex-wrap:wrap;gap:6px;font-size:.72rem;color:var(--muted);margin-top:5px}
.rec-box{background:var(--s2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-weight:600;color:var(--text);font-size:.71rem}
.inj-row{margin-top:4px;font-size:.69rem;color:var(--muted)}
.rest-row{font-size:.69rem;color:var(--muted);margin-top:3px}
.markets-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 8px}
.mkt{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px}
.ring-wrap{position:relative;width:40px;height:40px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:3}
.ring-fg{fill:none;stroke-width:3;stroke-linecap:round}
.ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700}
.mkt-name{font-size:.6rem;color:var(--muted);text-align:center;max-width:54px;line-height:1.2}
.best-pick-row{display:flex;align-items:center;justify-content:space-between;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:8px}
.bp-left .bp-type{font-size:.75rem;color:var(--muted)}
.bp-left .bp-pick{font-weight:700;font-size:.9rem;color:var(--acc)}
.bp-odds-box{text-align:right}
.bp-prob{font-size:.75rem;color:var(--muted)}
.bp-odds{font-weight:700;font-size:1rem;color:var(--green)}
.proj-row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.proj-box{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:.71rem;text-align:center;flex:1;min-width:62px;color:var(--muted)}
.proj-box span{display:block;font-weight:700;color:var(--acc);font-size:.85rem}
.combo-section{margin-top:0}
.combo-title{font-size:1rem;font-weight:700;color:var(--acc2);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.combo-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.combo-card{background:var(--card);border:1px solid var(--acc2);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.combo-card::before{content:'';display:block;height:3px;background:linear-gradient(90deg,var(--acc2),var(--acc));margin:-16px -16px 12px;border-radius:var(--radius) var(--radius) 0 0}
.combo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.combo-pick-row{display:flex;align-items:center;justify-content:space-between;padding:8px;background:var(--s2);border-radius:6px;margin-bottom:6px}
.cpr-left{font-size:.8rem}
.cpr-left em{color:var(--muted);font-style:normal;font-size:.7rem;display:block}
.cpr-odds{color:var(--green);font-weight:700;font-size:.85rem}
.cpr-p{color:var(--muted);font-size:.75rem}
.hist-table{width:100%;border-collapse:collapse;font-size:.82rem}
.hist-table th{background:var(--s2);padding:8px 10px;text-align:left;color:var(--muted);border-bottom:1px solid var(--border)}
.hist-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
.hist-table tr:hover td{background:var(--s2)}
.badge-hit{background:var(--green);color:#fff;padding:2px 8px;border-radius:4px;font-size:.7rem}
.badge-miss{background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;font-size:.7rem}
.cal-chart-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
#loadingOverlay{position:fixed;inset:0;background:rgba(244,247,251,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
#loadingOverlay .spin{width:48px;height:48px;border:4px solid var(--border);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingOverlay p{color:var(--muted);font-size:.9rem;text-align:center;max-width:300px}
.hidden{display:none!important}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}

.time-dual{font-size:.74rem;color:var(--muted);display:block;margin-top:4px;line-height:1.6}
.time-dual .tz-name{font-size:.64rem;opacity:.7;margin:0 3px}
.site-footer{text-align:center;padding:14px 0 8px;margin-top:28px;border-top:1px solid var(--border);font-size:.78rem;color:var(--muted)}
</style>
</head>

/* ===== STATE ===== */
const STATE={bakedPicks:null,bakedCombos:null};

/* ===== UTILS ===== */
function todayMadrid(){
  return new Date().toLocaleString('en-CA',{timeZone:'Europe/Madrid'}).slice(0,10);
}
function fmtTime(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const mad=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'});
  const car=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'America/Caracas'});
  return`<span class="time-dual">${mad}<span class="tz-name">MAD</span> · ${car}<span class="tz-name">CCS</span></span>`;
}
function impliedOdds(p){return p<=0||p>=1?1.01:Math.round((1/p)*0.95*100)/100;}

/* ===== CONFIDENCE ===== */
function confidenceLabel(pick){
  const mc=pick.R.mc;
  const code=pick.bestMkt.code;
  if(code==='ml_home'||code==='ml_away') return pick.bestMkt.p>=0.70?'Alto':'Medio';
  if(code.startsWith('spread')) return(mc.spreadDiv||0)>=3.5?'Alto':'Medio';
  if(code.startsWith('total')) return(mc.totalDiv||0)>=4.5?'Alto':'Medio';
  return'Medio';
}

/* ===== RING CHART ===== */
function ringColor(p){
  if(p>=0.80)return'#15803d';
  if(p>=0.70)return'#2563eb';
  if(p>=0.60)return'#a16207';
  return'#94a3b8';
}
function mkRing(p,label){
  const R=16,circ=2*Math.PI*R,dash=circ*p,gap=circ-dash,col=ringColor(p);
  return`<div class="mkt">
<div class="ring-wrap"><svg width="40" height="40"><circle class="ring-bg" cx="20" cy="20" r="${R}"/><circle class="ring-fg" cx="20" cy="20" r="${R}" stroke="${col}" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}"/></svg>
<div class="ring-val">${(p*100).toFixed(0)}%</div></div>
<div class="mkt-name">${label}</div></div>`;
}

/* ===== RENDER PICK ===== */
function renderPick(p){
  const mc=p.R.mc;
  const conf=p.confidence||confidenceLabel(p);
  const lid=(p.leagueId||'').toLowerCase();

  // Market labels (shorten for rings)
  const mktShort=m=>{
    const c=m.code;
    if(c==='ml_home')return p.home.split(' ').slice(-1)[0];
    if(c==='ml_away')return p.away.split(' ').slice(-1)[0];
    if(c==='spread_home')return'Hcap Local';
    if(c==='spread_away')return'Hcap Visit.';
    if(c==='total_over')return'Más pts';
    if(c==='total_under')return'Menos pts';
    return m.label;
  };

  const mktsHtml=p.markets.slice(0,6).map(m=>mkRing(m.p,mktShort(m))).join('');

  // Ratings
  const fmtNet=n=>n!=null?(n>=0?'+':'')+n.toFixed(1):'—';
  const ratH=`ORtg <b>${p.R.ortgH||'—'}</b> · DRtg <b>${p.R.drtgH||'—'}</b> · Net <b>${fmtNet(p.R.netH)}</b> · Pace <b>${p.R.paceH||'—'}</b>`;
  const ratA=`ORtg <b>${p.R.ortgA||'—'}</b> · DRtg <b>${p.R.drtgA||'—'}</b> · Net <b>${fmtNet(p.R.netA)}</b> · Pace <b>${p.R.paceA||'—'}</b>`;

  // Records & Rest
  const recH=p.R.recordH||'—', recA=p.R.recordA||'—';
  const restH=mc.rest?mc.rest.H:'—', restA=mc.rest?mc.rest.A:'—';

  // Injuries
  const injH=(p.R.injuriesH||[]).slice(0,2).join(' · ')||'Sin bajas reportadas';
  const injA=(p.R.injuriesA||[]).slice(0,2).join(' · ')||'Sin bajas reportadas';

  // Projections
  const projHtml=mc.projH!=null?`<div class="proj-row">
<div class="proj-box"><span>${mc.projH.toFixed(0)}</span>${p.home.split(' ').slice(-1)[0]}</div>
<div class="proj-box"><span>${mc.projMargin>0?'+':''}${mc.projMargin.toFixed(1)}</span>Margen</div>
<div class="proj-box"><span>${mc.projTotal.toFixed(0)}</span>Total</div>
<div class="proj-box"><span>${mc.projA.toFixed(0)}</span>${p.away.split(' ').slice(-1)[0]}</div>
</div>`:'';

  return`<div class="pick-card" data-league="${lid}">
<div class="pick-header">
<div>
<div class="pick-match">${p.flag} ${p.home} vs ${p.away}</div>
<div class="pick-league">${p.league}${fmtTime(p.time)}</div>
</div>
<div class="pick-badge ${conf.toLowerCase()}">${conf}</div>
</div>
<div class="ratings-row">
<div class="rat-team"><span class="rat-name">${p.home}</span>${ratH}</div>
<div class="rat-team"><span class="rat-name">${p.away}</span>${ratA}</div>
</div>
<div class="rec-row">
<span class="rec-box">🏆 ${p.home}: ${recH}</span>
<span class="rec-box">🏆 ${p.away}: ${recA}</span>
<span class="rec-box">💤 Desc: Local ${restH}d · Visit. ${restA}d</span>
</div>
<div class="inj-row">🚑 <b>${p.home}</b>: ${injH}</div>
<div class="inj-row">🚑 <b>${p.away}</b>: ${injA}</div>
${projHtml}
<div class="markets-row">${mktsHtml}</div>
<div class="best-pick-row">
<div class="bp-left">
<div class="bp-type">Mejor Apuesta</div>
<div class="bp-pick">${p.bestMkt.label}</div>
</div>
<div class="bp-odds-box">
<div class="bp-prob">P: ${(p.bestMkt.p*100).toFixed(1)}%</div>
<div class="bp-odds">@${p.bestMkt.odds.toFixed(2)}</div>
</div>
</div>
</div>`;
}

/* ===== RENDER COMBO ===== */
function renderCombo(c){
  const rows=c.picks.map(x=>`<div class="combo-pick-row">
<div class="cpr-left">${x.match}<em>${x.label}</em></div>
<div style="text-align:right"><span class="cpr-p">${(x.p*100).toFixed(1)}%</span><span class="cpr-odds" style="margin-left:8px">@${x.odds.toFixed(2)}</span></div>
</div>`).join('');
  return`<div class="combo-card">
<div class="combo-header">
<span style="font-weight:700;color:var(--acc2)">${c.name}</span>
<span style="font-size:.8rem;color:var(--muted)">P: ${(c.pComb*100).toFixed(1)}%</span>
</div>
${rows}
<div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
<span style="font-size:.8rem;color:var(--muted)">Cuota total</span>
<span style="font-weight:700;color:var(--green)">@${c.oddsComb.toFixed(2)}</span>
</div>
</div>`;
}

/* ===== RENDER ALL ===== */
function renderAll(picks,combos){
  const nAlto=picks.filter(p=>(p.confidence||confidenceLabel(p))==='Alto').length;
  const nMed=picks.filter(p=>(p.confidence||confidenceLabel(p))==='Medio').length;
  const nNBA=picks.filter(p=>p.leagueId==='nba').length;
  const nEuro=picks.filter(p=>p.leagueId!=='nba').length;

  document.getElementById('statsStrip').innerHTML=`
<div class="stat-card"><div class="stat-val">${picks.length}</div><div class="stat-lbl">Picks del Día</div></div>
<div class="stat-card"><div class="stat-val" style="color:var(--green)">${nAlto}</div><div class="stat-lbl">Confianza Alta</div></div>
<div class="stat-card"><div class="stat-val" style="color:var(--yellow)">${nMed}</div><div class="stat-lbl">Confianza Media</div></div>
<div class="stat-card"><div class="stat-val" style="color:#c8102e">${nNBA}</div><div class="stat-lbl">Picks NBA</div></div>
<div class="stat-card"><div class="stat-val" style="color:#0a1540">${nEuro}</div><div class="stat-lbl">Picks Europa</div></div>
<div class="stat-card"><div class="stat-val">${combos.length}</div><div class="stat-lbl">Combinados</div></div>`;

  document.getElementById('picksGrid').innerHTML=picks.length
    ?picks.map(renderPick).join('')
    :'<div class="empty-state">Sin picks disponibles para hoy</div>';

  document.getElementById('combosContainer').innerHTML=combos.length
    ?`<div class="combo-title">🎲 Combinados del Día <span style="font-size:.8rem;font-weight:400;color:var(--muted)">${combos.length} combinado${combos.length>1?'s':''}</span></div><div class="combo-cards">${combos.map(renderCombo).join('')}</div>`
    :'<div class="empty-state">Sin combinados disponibles</div>';
}

/* ===== HISTORIAL ===== */
const HIST_KEY=LS+'hist';
function getHist(){try{return JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch{return[];}}
function renderRecord(){
  const hist=getHist();
  const wrap=document.getElementById('recordContainer');
  if(!hist.length){
    wrap.innerHTML='<div class="empty-state" style="margin-top:0">Sin historial aún. Los picks de hoy se registran automáticamente.</div>';
    return;
  }
  const rows=hist.slice(0,50).map(h=>`<tr>
<td>${h.date}</td><td>${h.match}</td><td>${h.pick}</td><td>${h.odds?h.odds.toFixed(2):'—'}</td>
<td>${h.result==='hit'?'<span class="badge-hit">✓</span>':h.result==='miss'?'<span class="badge-miss">✗</span>':'<span style="color:var(--muted)">—</span>'}</td>
</tr>`).join('');
  wrap.innerHTML=`<div class="cal-chart-wrap"><table class="hist-table">
<thead><tr><th>Fecha</th><th>Partido</th><th>Pick</th><th>@Cuota</th><th>Resultado</th></tr></thead>
<tbody>${rows}</tbody></table></div>`;
}

/* ===== TABS ===== */
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  ['picks','combos','record'].forEach(id=>{
    const el=document.getElementById('tab'+id.charAt(0).toUpperCase()+id.slice(1));
    if(el)el.classList.toggle('hidden',id!==tab);
  });
  if(tab==='record')renderRecord();
}

/* ===== PDF ===== */
function exportPDF(){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF();
  doc.setFontSize(16);doc.text('BaloncestoIQ – Picks del Día',14,18);
  doc.setFontSize(10);doc.text(todayMadrid(),14,25);
  const picks=STATE.bakedPicks||BAKED_PICKS_K;
  const rows=picks.map(p=>[
    `${p.flag} ${p.home} vs ${p.away}`,p.league,
    p.bestMkt.label,(p.bestMkt.p*100).toFixed(1)+'%',
    '@'+p.bestMkt.odds.toFixed(2),p.confidence||confidenceLabel(p),
  ]);
  doc.autoTable({
    head:[['Partido','Liga','Pick','P%','@Cuota','Conf.']],
    body:rows,startY:30,styles:{fontSize:8},headStyles:{fillColor:[29,78,216]},
  });
  doc.text('Por Data Science Sandra Blanco | akera2011@protonmail.com',14,doc.lastAutoTable.finalY+10);
  doc.save(`BaloncestoIQ_${todayMadrid()}.pdf`);
}

/* ===== REMOTE FETCH ===== */
const REMOTE_URL='https://raw.githubusercontent.com/akera2010/akera2010/ccr-302eb251-8ontw0/basketball_data.json';
async function fetchBasketballData(){
  try{
    const r=await fetch(REMOTE_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok){console.warn('[BaloncestoIQ] basketball_data.json HTTP',r.status);return;}
    const d=await r.json();
    if(Array.isArray(d.picks)&&d.picks.length&&d.updated===todayMadrid()){
      STATE.bakedPicks=d.picks;
      STATE.bakedCombos=Array.isArray(d.combos)?d.combos:[];
      renderAll(STATE.bakedPicks,STATE.bakedCombos);
      document.getElementById('statusBar').textContent='✓ Actualizado '+d.updated;
      console.info('[BaloncestoIQ] Datos remotos cargados:',d.updated);
    }
  }catch(e){
    console.warn('[BaloncestoIQ] fetch remoto fallido — usando caché local:',e.message);
  }
}

/* ===== BOOT (2 fases) ===== */
function boot(){
  const today=todayMadrid();
  document.getElementById('dateLabel').textContent=today;

  // Fase 1: render inline inmediato
  const isToday=BAKED_DATE_K===today;
  if(isToday&&BAKED_PICKS_K.length){
    renderAll(BAKED_PICKS_K,BAKED_COMBOS_K);
    document.getElementById('statusBar').textContent='✓ Picks del '+BAKED_DATE_K;
  }else{
    document.getElementById('picksGrid').innerHTML='<div class="empty-state">Sin picks para hoy — trigger en curso…</div>';
    document.getElementById('statusBar').textContent='⏳ Esperando datos del día…';
  }
  document.getElementById('loadingOverlay').classList.add('hidden');

  // Fase 2: fetch remoto en background
  fetchBasketballData();
  setInterval(fetchBasketballData,30*60*1000);
}

boot();
